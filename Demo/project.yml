name: ADFReader
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  ADFKit:
    path: ..
targets:
  ADFReader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ADFReader
      - path: ../Fixtures
        buildPhase: resources
    dependencies:
      - package: ADFKit
        product: ADFKit
      - package: ADFKit
        product: ADFYouTube
      - package: ADFKit
        product: ADFBeam
      - package: ADFKit
        product: ADFAtlassianAuth
    info:
      path: ADFReader/Info.plist
      properties:
        CFBundleDisplayName: ADFReader
        # Keep the packaged plist in lockstep with the build settings —
        # xcodegen writes literal values, so without these the generated
        # Info.plist stays frozen at its first-generation numbers.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        NSCameraUsageDescription: Scans ADF Beam QR codes to import documents, and the pairing code adf-auth shows on your Mac to add your Atlassian account.
        # Scan from Mac fetches the sealed credential from `adf-auth push`
        # over plain HTTP on the LAN (one GET; the payload is ChaChaPoly-sealed
        # with a key that only travels in the QR fragment).
        NSLocalNetworkUsageDescription: ADFReader fetches your Atlassian sign-in from the adf-auth command on your Mac over your local network, once, when you scan its pairing code.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad multitasking (Split View / Slide Over) requires all four
        # orientations and resizable scenes (no UIRequiresFullScreen).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Exempt encryption only, so the build skips the Missing Compliance
        # prompt that otherwise blocks TestFlight. All crypto is Apple
        # OS-provided (CryptoKit, Security, URLSession TLS); no proprietary
        # or custom algorithms. ChaChaPoly (RFC 8439, a standard AEAD from
        # CryptoKit) only protects an authentication credential (the user's
        # Atlassian email + API token) during the one-time local handoff from
        # `adf-auth push` on the user's Mac. Encryption limited to
        # authentication, and encryption within Apple's OS, are both exempt
        # (EAR Category 5 Part 2; Apple's export compliance "limited to
        # authentication" and "only uses encryption within Apple's operating
        # system" exemptions).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connie.adfreader
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "22"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        # The app defines no App Intents; skipping extraction silences the
        # appintentsmetadataprocessor "no dependency found" warning.
        LM_SKIP_METADATA_EXTRACTION: YES
        DEVELOPMENT_TEAM: G47HJC6S26
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        # Distribution signing is scoped to release so simulator and debug
        # runs keep working without the App Store profile.
        release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: ADFReader App Store
    scheme:
      testTargets:
        - ADFReaderUITests
      gatherCoverageData: false
  ADFReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ADFReaderUITests
    dependencies:
      - target: ADFReader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connie.adfreader.uitests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ADFReader
        # Same as the app target: no App Intents, so skip the extractor's
        # "no AppIntents.framework dependency" warning.
        LM_SKIP_METADATA_EXTRACTION: YES
        DEVELOPMENT_TEAM: G47HJC6S26
