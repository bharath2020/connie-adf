# Per-repo no-mistakes settings.
#
# connie-adf has no CI by design, so the T0 work probe runs in the
# no-mistakes test step on every push (docs/Perf-Tiers.md). It compares the
# pushed HEAD against its merge-base with main: renderer work counts must
# match, and instructions/mallocs fail at >= +5 % (warn at +2-5 %). It needs
# no quiet host; it creates and deletes its own simulator and waits while
# another lane's perf-gate.sh / perf_trial.py run is in progress.
commands:
  test: 'Scripts/perf-probe.sh --tier all "$(git merge-base HEAD origin/main 2>/dev/null || git merge-base HEAD main)" HEAD'

test:
  instructions: |
    commands.test runs only the T0 work probe (Scripts/perf-probe.sh). Also
    run the package tests the change touches (`swift test --filter <Suite>`
    on macOS; iOS-only suites via xcodebuild on one simulator you create and
    delete). Never use another lane's simulator or "ADF Play (captain)".
    Put the T0 markdown table (the report.md path printed at the end of the
    probe run) in the test evidence so the PR body shows it. A count marked
    CHANGED needs a one-line explanation; a FAIL blocks the push. T1
    (Scripts/perf-scroll-counters.sh) and T2 (Scripts/perf-gate.sh) are not
    run here; docs/Perf-Tiers.md says when they are needed.
